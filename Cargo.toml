[workspace]
resolver = "2"
members = [
    "crates/cigp-core",
    "crates/cigp-crypto",
    "crates/cigp-proof",
    "crates/cigp-ledger",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["CIGP Contributors"]
repository = "https://github.com/cigp-protocol/CIGP-Protocol"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "=2.0.0", features = ["rand_core"] }
zeroize = "=1.7.0"
base64ct = "=1.6.0"

