name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo run -p cigp -- generate-demo-round /tmp/cigp-vectors
      - run: cargo run -p cigp -- verify /tmp/cigp-vectors/demo-round.json

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/cigp-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
